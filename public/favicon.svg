<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Emerald to Cyan Venture Growth Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Subtle Glow Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10B981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Rounded Square Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#334155" stroke-width="10" stroke-opacity="0.5"/>

  <!-- Venture Capital "VC" Stylized Glyph -->
  <g filter="url(#glow)">
    <!-- Letter 'V' -->
    <path d="M 108 160 L 168 160 L 220 320 L 272 160 L 332 160 L 246 380 L 194 380 Z" fill="url(#brandGrad)"/>

    <!-- Letter 'C' -->
    <path d="M 416 220 C 395 180 355 160 305 160 C 230 160 180 215 180 290 C 180 365 230 420 305 420 C 355 420 395 400 416 360 L 372 334 C 358 358 335 372 305 372 C 258 372 230 338 230 290 C 230 242 258 208 305 208 C 335 208 358 222 372 246 Z" fill="#FFFFFF" fill-opacity="0.95"/>
  </g>

  <!-- Upward Growth Arrow / Sovereign Node -->
  <circle cx="400" cy="120" r="28" fill="#10B981" stroke="#FFFFFF" stroke-width="6"/>
  <path d="M 390 120 L 400 110 L 410 120 M 400 110 L 400 130" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>